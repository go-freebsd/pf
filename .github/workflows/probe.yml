name: Probe

on:
  push:

jobs:
  probe:
    name: Probe ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: true
          run: |
            set +e
            cd "$GITHUB_WORKSPACE"
            {
              uname -sr
              kldload pf 2>&1
              n=0
              try() {
                n=$((n+1))
                echo "--- $1"
                printf '%s\n' "$1" | pfctl -a "p$n" -f - 2>&1 | grep -v ALTQ
                pfctl -a "p$n" -sr -vv 2>&1 | grep -v 'ALTQ\|^  \['
                pfctl -a "p$n" -sn -vv 2>&1 | grep -v 'ALTQ\|^  \['
              }
              try 'scrub in inet all no-df'
              try 'scrub in inet all min-ttl 64'
              try 'scrub in inet all max-mss 1440'
              try 'scrub in inet all random-id'
              try 'scrub in inet all reassemble tcp'
              try 'scrub in inet all no-df min-ttl 64 max-mss 1440 random-id reassemble tcp fragment reassemble'
              try 'scrub in inet all fragment reassemble'
              try 'scrub in inet all'
              try 'pass in inet proto tcp from 10.0.0.1 to 10.0.0.2 port 40002 keep state'
              try 'pass in inet proto tcp from 10.0.0.1 to 10.0.0.2 port 40003 rtable 0 keep state'
              try 'pass in inet proto tcp from any to any port 40900 divert-to 127.0.0.1 port 40901'
              try 'pass in inet6 proto tcp from any to any port 40900 divert-to ::1 port 40901'
              try 'pass in inet proto tcp from any to any port 41001 keep state queue (std, ack)'
              try 'pass in inet proto tcp from any to any port 41002 keep state tag T1'
              try 'pass in inet proto tcp from any to any port 41009 keep state tagged T1 tag T2'
              try 'pass in inet proto tcp from any to any port 41010 keep state set prio (3, 5)'
              try 'pass in inet proto tcp from any to any port 41011 keep state dnpipe (1, 2)'
              try 'pass in inet proto tcp from any to any port 41012 keep state dnqueue 3'
            } > probe.log 2>&1
            exit 0
      - run: |
          msg=$(sed -e 's/%/%25/g' probe.log | awk '{printf "%s%%0A", $0}')
          echo "::notice title=probe ${{ matrix.release }}::$msg"
