name: Probe

on:
  push:

jobs:
  probe:
    name: Probe ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: true
          prepare: |
            pkg install -y go
          run: |
            set +e
            cd "$GITHUB_WORKSPACE"
            kldload pf 2>&1
            go test -count=1 -run 'TestRouteDiag' -v . > probe.log 2>&1
            exit 0
      - run: |
          msg=$(grep -v '^=== ' probe.log | grep -E 'libpfctl|FAIL|error|undefined|\\.go' | head -n 60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=probe ${{ matrix.release }}::$msg"
