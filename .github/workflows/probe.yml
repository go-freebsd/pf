name: Probe

on:
  push:

jobs:
  probe:
    name: Probe ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: true
          run: |
            set +e
            cd "$GITHUB_WORKSPACE"
            {
              uname -sr
              kldload pf 2>&1
              echo "--- pool ioctls"
              grep -nE 'define[[:space:]]+DIOC(BEGINADDRS|ADDADDR|GETADDRS|GETADDR|GETRULESETS|GETRULESET|RADDTABLES|RADDADDRS|RGETADDRS|RDELTABLES|RGETTABLES)[[:space:]]' /usr/include/net/pfvar.h
              grep -n -A12 'struct[[:space:]]*pfioc_pooladdr[[:space:]]*{' /usr/include/net/pfvar.h /usr/include/netpfil/pf/pf.h | head -n 20
              grep -n -A14 'struct[[:space:]]*pf_pooladdr[[:space:]]*{' /usr/include/net/pfvar.h /usr/include/netpfil/pf/pf.h | head -n 20
              grep -n -A12 'struct[[:space:]]*pf_pool[[:space:]]*{' /usr/include/net/pfvar.h /usr/include/netpfil/pf/pf.h | head -n 18
              echo "--- pfctl output"
              printf '%s\n' \
                'nat on lo0 inet from 10.0.0.0/24 to any -> 192.0.2.1' \
                'no nat on lo0 inet from 10.1.0.0/24 to any' \
                'rdr on lo0 inet proto tcp from any to 192.0.2.1 port 40001 -> 10.0.0.5 port 40002' \
                'no rdr on lo0 inet proto tcp from any to 192.0.2.9 port 40003' \
                'binat on lo0 inet from 10.0.0.9 to any -> 192.0.2.9' \
                'scrub in on lo0 all no-df' \
                'pass in inet proto tcp from any to <t1> port 40004 keep state' > /tmp/r.conf
              pfctl -a probe -f /tmp/r.conf 2>&1
              echo "--- -sn"; pfctl -a probe -sn 2>&1
              echo "--- -sn -vv"; pfctl -a probe -sn -vv 2>&1
              echo "--- -sr"; pfctl -a probe -sr 2>&1
              echo "--- -sr -vv"; pfctl -a probe -sr -vv 2>&1
              echo "--- -sA"; pfctl -a probe -sA 2>&1
              echo "--- tables"; pfctl -a probe -sT 2>&1; pfctl -a probe -t t1 -T add 10.9.9.1 2>&1; pfctl -a probe -t t1 -T show 2>&1
            } > probe.log 2>&1
            exit 0
      - run: |
          msg=$(sed -e 's/%/%25/g' probe.log | awk '{printf "%s%%0A", $0}')
          echo "::notice title=probe ${{ matrix.release }}::$msg"
