name: Probe

on:
  push:

jobs:
  probe:
    name: Probe ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: true
          run: |
            set +e
            cd "$GITHUB_WORKSPACE"
            {
              uname -sr
              grep -n 'dnpipe\|dnrpipe\|free_flags\|dnflags\|dn_' /usr/include/netpfil/pf/pf.h /usr/include/net/pfvar.h | head -30
              echo "--- struct pf_rule"
              awk '/^struct pf_rule \{/,/^\};/' /usr/include/net/pfvar.h /usr/include/netpfil/pf/pf.h | grep -n 'u_int16_t\|char\|u_int32_t\|u_int8_t' | head -80
            } > probe.log 2>&1
            exit 0
      - run: |
          msg=$(sed -e 's/%/%25/g' probe.log | awk '{printf "%s%%0A", $0}')
          echo "::notice title=probe ${{ matrix.release }}::$msg"
